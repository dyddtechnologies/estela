name: Distribute (GitHub Release artifact)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: estela-distribute
  cancel-in-progress: false

permissions:
  contents: write # crear Release y adjuntar el tarball

jobs:
  distribute:
    name: pack + release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }

      - name: Guard — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }

      - name: Install
        run: npm ci

      - name: Verify (typecheck → lint → format → build → test → bounds → complexity → audit)
        run: npm run verify

      - name: Pack tarball
        run: |
          mkdir -p release
          npm pack --pack-destination ./release
          ls -la release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: estela-nest-${{ github.ref_name }}
          path: release/*.tgz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz \
            --generate-notes \
            --title "ESTELA $GITHUB_REF_NAME"

    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgm)"/>
  <g fill="#DCE7FF">
    <circle cx="96" cy="96" r="2.4" opacity="0.8"/>
    <circle cx="420" cy="120" r="2" opacity="0.6"/>

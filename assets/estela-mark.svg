    <circle cx="120" cy="400" r="2.2" opacity="0.6"/>
    <circle cx="430" cy="420" r="2.4" opacity="0.7"/>
  </g>
  <path d="M 196 150 C 300 210, 340 300, 470 300" stroke="url(#trailm)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <g fill="#67E8F9">
    <circle cx="262" cy="200" r="13" opacity="0.95"/>
    <circle cx="332" cy="258" r="10" opacity="0.8"/>
    <circle cx="402" cy="292" r="8" opacity="0.6"/>
  </g>
  <circle cx="150" cy="142" r="56" fill="url(#headm)" filter="url(#glowm)"/>
  <circle cx="150" cy="142" r="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ESTELA">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E23"/>
      <stop offset="1" stop-color="#1A1F4B"/>
    </linearGradient>
    <linearGradient id="trailm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="headm" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#7DE9FF"/>
      <stop offset="1" stop-color="#7C6CF8"/>
    </radialGradient>
    <filter id="glowm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

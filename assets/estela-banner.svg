<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="ESTELA — EIP runtime para NestJS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E23"/>
      <stop offset="0.55" stop-color="#0F1430"/>
      <stop offset="1" stop-color="#1A1F4B"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="head" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#7DE9FF"/>
      <stop offset="1" stop-color="#7C6CF8"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFD8FF"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#67E8F9"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>

  <g fill="#DCE7FF">
    <circle cx="320" cy="58" r="1.6" opacity="0.7"/>
    <circle cx="452" cy="94" r="1.2" opacity="0.5"/>
    <circle cx="612" cy="52" r="1.8" opacity="0.8"/>
    <circle cx="760" cy="86" r="1.3" opacity="0.55"/>
    <circle cx="902" cy="44" r="1.7" opacity="0.75"/>
    <circle cx="1048" cy="92" r="1.2" opacity="0.5"/>
    <circle cx="1128" cy="60" r="1.6" opacity="0.7"/>
    <circle cx="560" cy="330" r="1.4" opacity="0.5"/>
    <circle cx="700" cy="360" r="1.2" opacity="0.45"/>
    <circle cx="940" cy="344" r="1.6" opacity="0.6"/>
    <circle cx="1090" cy="300" r="1.3" opacity="0.5"/>
    <circle cx="86" cy="300" r="1.5" opacity="0.6"/>
    <circle cx="60" cy="60" r="1.8" opacity="0.8"/>
  </g>

  <path d="M 186 112 C 300 170, 380 214, 500 214" stroke="url(#trail)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#67E8F9">
    <circle cx="268" cy="158" r="9" opacity="0.95"/>
    <circle cx="338" cy="196" r="7" opacity="0.8"/>
    <circle cx="410" cy="212" r="5.5" opacity="0.6"/>
  </g>

  <line x1="546" y1="215" x2="568" y2="215" stroke="#67E8F9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="215" x2="642" y2="215" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="500" y="196" width="44" height="38" rx="10" fill="#0E1633" stroke="#67E8F9" stroke-width="2"/>
  <rect x="574" y="196" width="44" height="38" rx="10" fill="#0E1633" stroke="#818CF8" stroke-width="2"/>
  <rect x="648" y="196" width="44" height="38" rx="10" fill="#0E1633" stroke="#A78BFA" stroke-width="2"/>

  <circle cx="140" cy="110" r="40" fill="url(#head)" filter="url(#glow)"/>
  <circle cx="140" cy="110" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="740" y="232" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="10" fill="url(#word)">ESTELA</text>
  <text x="744" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="3" fill="#8FA3CC">EIP RUNTIME PARA NESTJS</text>
  <text x="744" y="312" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" letter-spacing="1.5" fill="#5F6FA8">canales · trazas · idempotencia · grafo</text>
</svg>
